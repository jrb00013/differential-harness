[project]
name = "differential-harness"
version = "0.1.0"
description = "Physics-first notebooks for combinatorial energy column modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "sympy>=1.12",
  "pandas>=2.2",
]

[project.optional-dependencies]
paper = ["reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*"]

[project.scripts]
sgh1-size = "simulation.run_sizing:main"
sgh1-log = "daq.logger:main"
